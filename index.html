<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 부부 가계부</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f6f5f3;--card:#fff;--ink:#292524;--sub:#78716c;--line:#e7e5e4;--ok:#059669;--bad:#e11d48;--warn:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif;padding:16px 16px 80px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:20px;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn,input,select{font:inherit;font-size:14px}
button,.btn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink)}
button:hover,.btn:hover{background:#f5f5f4}
input,select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 0 0 1px var(--line);margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 0 0 1px var(--line)}
.kpi small{color:var(--sub);display:block}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums}
.gauge{height:12px;background:#f1f0ee;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.gauge i{display:block;height:100%;border-radius:99px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.sub{color:var(--sub);font-size:12px}
.n{font-variant-numeric:tabular-nums;text-align:right}
.li{display:flex;justify-content:space-between;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer}
.li:hover{background:#fafaf9}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px;font-size:14px}
th{text-align:left;color:var(--sub);font-weight:500;font-size:12px;padding:4px}
td{border-top:1px solid var(--line);padding:3px}
td input,td select{width:100%;border-color:transparent;background:transparent}
td input:focus{background:#fff;border-color:var(--line)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal .box{background:#fff;border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:80vh;overflow:auto}
#busy{background:#fffbeb;color:#92400e;border-radius:10px;padding:8px 12px;margin-bottom:12px;display:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.form label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.form input,.form select{width:100%}
.form .full{grid-column:1/-1}
.pri{background:#292524;color:#fff;border-color:#292524}.pri:hover{background:#44403c}
.red{color:var(--bad)}.green{color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="row"><h1>우리 부부 가계부</h1><input type="month" id="month" onchange="setMonth(this.value)"><span id="sync" class="sub"></span></div>
    <div class="row">
      <button class="pri" onclick="openForm()">+ 직접 입력</button>
      <label class="btn">카드 명세서<input type="file" accept="image/*" multiple hidden onchange="upload(this,'card')"></label>
      <label class="btn">통장 캡처<input type="file" accept="image/*" multiple hidden onchange="upload(this,'bank')"></label>
      <button onclick="loadFixed()">지난달 고정 내역 불러오기</button>
      <button onclick="sample()">샘플 데이터</button>
      <button onclick="keyBox()">API 키</button>
      <button onclick="roomBox()">방 코드</button>
    </div>
  </div>
  <div id="busy"></div>
  <div id="app"></div>
</div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="mbox"></div></div>

<script>
/* =====================================================================
   [Firebase 설정 방법 — 5분이면 돼요]
   1) https://console.firebase.google.com 접속 → "프로젝트 추가" (애널리틱스는 꺼도 됩니다)
   2) 왼쪽 메뉴 "빌드 > Firestore Database" → "데이터베이스 만들기" → 위치는 asia-northeast3(서울) 추천
   3) Firestore "규칙" 탭에 아래를 붙여넣고 "게시":
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /rooms/{room}/tx/{id} { allow read, write: if true; }
          }
        }
      → 방 코드를 아는 사람만 해당 방의 내역을 읽고 쓸 수 있어요. 방 코드는 길고 추측하기 어렵게 정하세요.
   4) 프로젝트 설정(톱니바퀴) > "내 앱" > 웹 앱(</>) 추가 → 나오는 firebaseConfig 값을 아래에 붙여넣기
   5) 이 HTML 파일을 두 사람이 같은 곳에서 열어야 해요. 같은 URL로 쓰려면 Firebase Hosting, GitHub Pages,
      Netlify Drop 등에 이 파일을 올리세요. (파일을 각자 따로 열어도 같은 firebaseConfig + 같은 방 코드면 동기화돼요.)
   6) 상단 "방 코드" 버튼에서 두 사람이 같은 코드를 입력하면 연결 끝!
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBLVF6X3h6P-FQ7994J1uOZdtX5u9hH7Mo",
  authDomain: "haesungsukyeong.firebaseapp.com",
  projectId: "haesungsukyeong",
  storageBucket: "haesungsukyeong.firebasestorage.app",
  messagingSenderId: "441293508007",
  appId: "1:441293508007:web:7eb22c8dd4650d34ea3a82",
  measurementId: "G-P1E9ZK0TD0"
};

/* ===== 설정 ===== */
const G={income:{l:'수입',c:['주수입','부수입']},saving:{l:'저축',c:['적금','청약','목적저금']},
fixed:{l:'고정지출',c:['대출이자','통신비','관리비','정수기','용돈','구독료']},
living:{l:'식비+생활용품',c:['식비','생활용품']},irregular:{l:'비정기 지출',c:['꾸밈','여행','문화생활','건강','경조사']},etc:{l:'기타',c:['기타']}};
const ALL=Object.values(G).flatMap(g=>g.c), BUDGET=600000;
const grp=c=>Object.keys(G).find(k=>G[k].c.includes(c))||'etc';
const isExp=c=>['fixed','living','irregular','etc'].includes(grp(c));
const won=n=>(n||0).toLocaleString('ko-KR')+'원';
const uid=()=>Math.random().toString(36).slice(2,10);
const COL={fixed:'#94a3b8',living:'#f59e0b',irregular:'#e879a0',etc:'#cbd5e1'};
const RULES=[[/쿠팡|마트|배달|GS25|CU|푸드|식당|카페|빵/i,'식비'],[/다이소|올리브영|모던하우스|이케아/i,'생활용품'],[/유니클로|LF|무신사|자라|의류/i,'꾸밈'],[/항공|호텔|숙박|여행|코레일/i,'여행'],[/영화|CGV|도서|교보|공연/i,'문화생활'],[/병원|의원|약국|치과/i,'건강']];
const guess=n=>(RULES.find(r=>r[0].test(n))||[0,'기타'])[1];

/* ===== 상태 ===== */
const d0=new Date();
let month=`${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,'0')}`;
let tx=JSON.parse(localStorage.getItem('ledger')||'[]');
let apiKey=localStorage.getItem('gkey')||'';
let sel=[], charts=[];
const save=()=>localStorage.setItem('ledger',JSON.stringify(tx));
/* ===== Firestore 동기화 ===== */
let db=null,unsub=null,room='0314';
const fbOn=()=>!!(firebaseConfig.apiKey&&firebaseConfig.projectId);
const col=()=>db.collection('rooms').doc(room).collection('tx');
const setSync=t=>{const e=document.getElementById('sync');if(e)e.textContent=t};
function put(t){const i=tx.findIndex(x=>x.id===t.id);if(i<0)tx.push(t);else tx[i]=t;save();if(db&&room)col().doc(t.id).set(t).catch(e=>setSync('🔴 저장 실패: '+e.code))}
function rmv(id){tx=tx.filter(x=>x.id!==id);save();if(db&&room)col().doc(id).delete().catch(e=>setSync('🔴 삭제 실패: '+e.code))}
function roomBox(){
  if(!fbOn())return alert('코드 맨 위 firebaseConfig에 Firebase 설정값을 먼저 붙여넣어 주세요. (설정 방법은 코드 상단 주석 참고)');
  const r=prompt('부부가 함께 쓸 방 코드를 입력하세요.\n두 사람이 똑같이 입력해야 같은 가계부가 열려요.\n(길고 추측하기 어렵게: 예 sukyung-home-2026-x7k)',room);
  if(r!==null){room=r.trim();localStorage.setItem('room',room);connect()}
}
function connect(){
  if(unsub){unsub();unsub=null}
  if(!fbOn()){setSync('💾 이 기기에만 저장 중');return}
  if(!room){setSync('방 코드를 입력하면 공유돼요');return}
  try{
    if(!db){firebase.initializeApp(firebaseConfig);db=firebase.firestore()}
    let first=true;setSync('연결 중…');
    unsub=col().onSnapshot(s=>{
      if(first){first=false;
        if(s.empty&&tx.length&&confirm(`이 기기의 기존 내역 ${tx.length}건을 공유 가계부 "${room}"에 올릴까요?`)){tx.slice().forEach(put);setSync('🟢 실시간 동기화 중');return}}
      tx=s.docs.map(d=>d.data());save();render();setSync('🟢 실시간 동기화 중');
    },e=>setSync('🔴 연결 실패('+e.code+') — 규칙·설정값을 확인하세요'));
  }catch(e){setSync('🔴 설정 오류: '+e.message)}
}
const cur=()=>tx.filter(t=>t.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date));
const sum=a=>a.reduce((s,t)=>s+t.amount,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setMonth(v){if(v){month=v;sel=[];render()}}
function upd(id,k,v){const t=tx.find(x=>x.id===id);t[k]=k==='amount'?+v||0:k==='rec'?!!v:v;put(t);render()}
function del(ids){ids.forEach(rmv);sel=[];render()}
function add(){put({id:uid(),date:month+'-01',name:'새 항목',amount:0,cat:'기타',memo:'',rec:false});render()}
function tog(id,on){sel=on?[...sel,id]:sel.filter(i=>i!==id)}
function merge(){const r=cur().filter(t=>sel.includes(t.id));if(r.length<2)return alert('합칠 항목을 2개 이상 선택하세요.');
  const [a,...rest]=r;a.name=`${a.name} 외 ${rest.length}건`;a.amount=sum(r);put(a);del(rest.map(x=>x.id))}
function sample(){const m=month,P=(d,name,amount,cat,rec)=>({id:uid(),date:`${m}-${d}`,name,amount,cat,memo:'',rec});
  [P('01','급여',3800000,'주수입',1),P('10','청약',200000,'청약',1),P('10','적금',500000,'적금',1),P('05','대출이자',650000,'대출이자',1),
  P('07','통신비',89000,'통신비',1),P('25','관리비',180000,'관리비',1),P('03','쿠팡',182400,'식비'),P('08','이마트',214300,'식비'),P('12','다이소',38600,'생활용품'),
  P('15','유니클로',429200,'꾸밈'),P('16','LF스퀘어',453908,'꾸밈'),P('18','모던하우스',87000,'꾸밈'),P('20','○○내과',32000,'건강'),P('22','CGV',28000,'문화생활')].forEach(put);render()}
function loadFixed(){const [y,m]=month.split('-').map(Number),pm=`${m===1?y-1:y}-${String(m===1?12:m-1).padStart(2,'0')}`,last=new Date(y,m,0).getDate(),c=cur();
  const add=tx.filter(t=>t.rec&&t.date.startsWith(pm)&&!c.some(x=>x.rec&&x.name===t.name&&x.cat===t.cat)).map(t=>({...t,id:uid(),date:`${month}-${String(Math.min(+t.date.slice(8),last)).padStart(2,'0')}`}));
  if(!add.length)return alert('불러올 지난달 고정 내역이 없거나 이미 모두 반영되어 있어요.');add.forEach(put);render()}
function exportFile(type){const rows=cur().map(t=>({날짜:t.date,구분:G[grp(t.cat)].l,항목:t.cat,내용:t.name,금액:t.amount,메모:t.memo}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),month);XLSX.writeFile(wb,`가계부_${month}.${type}`,{bookType:type})}

/* ===== Gemini OCR ===== */
const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
function keyBox(){const k=prompt('Gemini API 키를 입력하세요 (이 브라우저에만 저장돼요)',apiKey);if(k!==null){apiKey=k.trim();localStorage.setItem('gkey',apiKey)}}
async function upload(inp,kind){
  const files=[...inp.files];inp.value='';if(!files.length)return;
  if(!apiKey){keyBox();if(!apiKey)return}
  const busy=document.getElementById('busy');busy.style.display='block';busy.textContent=kind==='card'?'카드 명세서 분석 중…':'통장 내역 분석 중…';
  const cats=kind==='card'?ALL.filter(isExp):ALL;
  const prompt=kind==='card'
   ?`카드 이용내역 명세서 이미지다. 모든 행에서 이용일(YYYY-MM-DD, 연도가 없으면 ${month.slice(0,4)}), 이용가맹점, 실제 결제 원금(할인 제외, 양의 정수)을 추출하고 cat을 다음 중 하나로 분류해: ${cats.join(', ')}. JSON 배열만 출력: [{"date","name","amount","cat"}]`
   :`통장 입금/자동이체 캡처다. 날짜(YYYY-MM-DD, 연도가 없으면 ${month.slice(0,4)}), 항목명, 금액(양의 정수)을 추출하고 cat을 다음 중 하나로 분류해: ${cats.join(', ')}. 급여 입금은 수입, 적금·청약은 저축, 그 외는 고정지출. JSON 배열만 출력: [{"date","name","amount","cat"}]`;
  try{
    const parts=[{text:prompt}];for(const f of files)parts.push({inline_data:{mime_type:f.type||'image/jpeg',data:await b64(f)}});
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:'application/json'}})});
    if(!r.ok)throw new Error('API 오류 '+r.status);
    const j=await r.json(),rows=JSON.parse(j.candidates[0].content.parts[0].text.replace(/```json|```/g,''));
    rows.map(x=>({id:uid(),date:x.date,name:x.name,amount:Math.abs(+x.amount||0),cat:ALL.includes(x.cat)?x.cat:guess(x.name),memo:'',rec:kind==='bank'})).forEach(put);
  }catch(e){alert('인식에 실패했어요: '+e.message+'\nAPI 키와 이미지를 확인해 주세요.')}
  busy.style.display='none';render();
}

/* ===== 직접 입력 ===== */
function openForm(){
  const t=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),d=t.startsWith(month)?t:month+'-01';
  document.getElementById('mbox').innerHTML=`<b style="font-size:16px">직접 입력</b>
  <div class="form">
    <div><label>날짜</label><input type="date" id="f_date" value="${d}"></div>
    <div><label>구분</label><select id="f_grp" onchange="fGrp()">${Object.keys(G).map(k=>`<option value="${k}" ${k==='living'?'selected':''}>${G[k].l}</option>`).join('')}</select></div>
    <div><label>세부 항목</label><select id="f_cat"></select></div>
    <div><label>금액 (원)</label><input type="number" id="f_amt" inputmode="numeric" placeholder="0"></div>
    <div class="full"><label>내용 (가맹점)</label><input id="f_name" placeholder="예: 이마트"></div>
    <div class="full"><label>메모</label><input id="f_memo" placeholder="선택"></div>
    <div class="full"><label style="display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" id="f_rec" style="width:auto"> 매월 반복 (다음 달에 ‘고정 내역 불러오기’로 가져와요)</label></div>
  </div>
  <div class="row" style="justify-content:flex-end"><button onclick="closeModal()">취소</button><button onclick="saveForm(true)">저장 후 계속</button><button class="pri" onclick="saveForm(false)">저장</button></div>`;
  fGrp();document.getElementById('modal').style.display='flex';setTimeout(()=>document.getElementById('f_name').focus(),50);
}
function fGrp(){const g=document.getElementById('f_grp').value;
  document.getElementById('f_cat').innerHTML=G[g].c.map(c=>`<option>${c}</option>`).join('');
  document.getElementById('f_rec').checked=['income','saving','fixed'].includes(g)}
function saveForm(keep){
  const v=i=>document.getElementById(i).value,date=v('f_date'),name=v('f_name').trim(),amount=Math.abs(+v('f_amt')||0);
  if(!date)return alert('날짜를 선택해 주세요.');if(!name)return alert('내용(가맹점)을 입력해 주세요.');if(!amount)return alert('금액을 입력해 주세요.');
  put({id:uid(),date,name,amount,cat:v('f_cat'),memo:v('f_memo').trim(),rec:document.getElementById('f_rec').checked});
  month=date.slice(0,7);sel=[];render();
  if(keep){openForm();document.getElementById('f_date').value=date}else closeModal();
}

/* ===== 모달 (드릴다운) ===== */
function openCat(cat){const rows=cur().filter(t=>t.cat===cat),m={};rows.forEach(t=>m[t.name]=(m[t.name]||0)+t.amount);
  const ms=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  document.getElementById('mbox').innerHTML=`<div class="row" style="justify-content:space-between"><b>${cat} · ${won(sum(rows))}</b><button onclick="closeModal()">닫기</button></div>
  <p class="sub">가맹점별 합계</p>${ms.map(([n,v])=>`<div class="li" style="cursor:default"><span>${esc(n)}</span><span class="n">${won(v)}</span></div>`).join('')||'<p class="sub">이 달 내역이 없어요.</p>'}
  <p class="sub" style="margin-top:14px">상세 내역</p>${rows.map(t=>`<div class="li" style="cursor:default"><span class="sub">${t.date.slice(5)}</span><span style="flex:1;margin:0 8px">${esc(t.name)}</span><span class="n">${won(t.amount)}</span></div>`).join('')}`;
  document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
let irrOpen=false;function toggleIrr(){irrOpen=!irrOpen;render()}

/* ===== 렌더 ===== */
function render(){
  document.getElementById('month').value=month;
  const c=cur(),by=g=>c.filter(t=>grp(t.cat)===g);
  const inc=sum(by('income')),sav=sum(by('saving')),exp=sum(c.filter(t=>isExp(t.cat))),sur=inc-sav-exp,liv=sum(by('living')),irr=sum(by('irregular'));
  const pct=Math.min(100,liv/BUDGET*100),over=liv>BUDGET;
  const gc=over?'var(--bad)':pct>85?'var(--warn)':'var(--ok)';
  document.getElementById('app').innerHTML=`
  <div class="kpis">
    <div class="kpi"><small>총 수입</small><b>${won(inc)}</b></div>
    <div class="kpi"><small>총 저축 · 저축률 ${inc?Math.round(sav/inc*100):0}%</small><b>${won(sav)}</b></div>
    <div class="kpi"><small>총 지출</small><b>${won(exp)}</b></div>
    <div class="kpi"><small>잉여 현금 (목표 0원)</small><b class="${sur<0?'red':'green'}">${won(sur)}</b></div>
  </div>
  <div class="card"><div class="row" style="justify-content:space-between"><div><b>식비 + 생활용품 통합 예산</b><div class="sub">월 ${won(BUDGET)}</div></div>
    <div class="n"><b style="font-size:18px">${won(liv)}</b><div class="sub ${over?'red':''}">${over?won(liv-BUDGET)+' 초과':won(BUDGET-liv)+' 남음'}</div></div></div>
    <div class="gauge"><i style="width:${pct}%;background:${gc}"></i></div>
    <div class="sub">${G.living.c.map(k=>`${k} ${won(sum(c.filter(t=>t.cat===k)))}`).join(' · ')}</div></div>
  <div class="card"><div class="row" style="justify-content:space-between;cursor:pointer" onclick="toggleIrr()"><div><b>비정기 지출</b><div class="sub">탭해서 가맹점별 내역 보기</div></div><b>${won(irr)} ${irrOpen?'▲':'▼'}</b></div>
    ${irrOpen?G.irregular.c.map(k=>`<div class="li" onclick="openCat('${k}')"><span>${k}</span><span class="n">${won(sum(c.filter(t=>t.cat===k)))}</span></div>`).join(''):''}</div>
  <div class="grid2"><div class="card"><b>항목별 지출 순위</b><canvas id="c1" height="220"></canvas></div>
    <div class="card"><b>월별 지출 추이</b><canvas id="c2" height="220"></canvas></div></div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>${month} 내역 (${c.length}건)</b>
    <div class="row"><button onclick="add()">추가</button><button onclick="merge()">합치기</button><button onclick="del(sel)">선택 삭제</button><button onclick="exportFile('xlsx')">Excel</button><button onclick="exportFile('csv')">CSV</button></div></div>
    <div class="tw"><table><tr><th></th><th>날짜</th><th>내용</th><th>항목</th><th>금액</th><th>메모</th><th>매월반복</th></tr>
    ${c.map(t=>`<tr><td><input type="checkbox" ${sel.includes(t.id)?'checked':''} onchange="tog('${t.id}',this.checked)" style="width:auto"></td>
    <td><input type="date" value="${t.date}" onchange="upd('${t.id}','date',this.value)"></td>
    <td><input value="${esc(t.name)}" onchange="upd('${t.id}','name',this.value)"></td>
    <td><select onchange="upd('${t.id}','cat',this.value)">${Object.values(G).map(g=>`<optgroup label="${g.l}">${g.c.map(k=>`<option ${k===t.cat?'selected':''}>${k}</option>`).join('')}</optgroup>`).join('')}</select></td>
    <td><input type="number" class="n" value="${t.amount}" onchange="upd('${t.id}','amount',this.value)"></td>
    <td><input value="${esc(t.memo)}" placeholder="메모" onchange="upd('${t.id}','memo',this.value)"></td>
    <td><input type="checkbox" ${t.rec?'checked':''} onchange="upd('${t.id}','rec',this.checked)" style="width:auto"></td></tr>`).join('')}</table>
    ${c.length?'':'<p class="sub" style="text-align:center;padding:24px">내역이 없어요. 명세서를 올리거나 ‘샘플 데이터’를 눌러 보세요.</p>'}</div></div>`;
  drawCharts(c);
}
function drawCharts(c){
  charts.forEach(x=>x.destroy());charts=[];
  const m={};c.filter(t=>isExp(t.cat)).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amount);
  const r=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  charts.push(new Chart(document.getElementById('c1'),{type:'bar',data:{labels:r.map(x=>x[0]),datasets:[{data:r.map(x=>x[1]),backgroundColor:'#f59e0b',borderRadius:6}]},
    options:{indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>won(i.raw)}}},scales:{x:{display:false},y:{grid:{display:false}}}}}));
  const ms=[...new Set(tx.map(t=>t.date.slice(0,7)))].sort();
  charts.push(new Chart(document.getElementById('c2'),{type:'bar',
    data:{labels:ms.map(x=>x.slice(5)+'월'),datasets:['fixed','living','irregular','etc'].map(g=>({label:G[g].l,backgroundColor:COL[g],data:ms.map(x=>sum(tx.filter(t=>t.date.startsWith(x)&&grp(t.cat)===g)))}))},
    options:{plugins:{tooltip:{callbacks:{label:i=>`${i.dataset.label} ${won(i.raw)}`}}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,ticks:{callback:v=>v/10000+'만'}}}}}));
}
render();connect();
</script>
</body>
</html>
