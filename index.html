<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 부부 가계부</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f6f5f3;--card:#fff;--ink:#292524;--sub:#78716c;--line:#e7e5e4;--ok:#059669;--bad:#e11d48;--warn:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif;padding:16px 16px 80px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:20px;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn,input,select{font:inherit;font-size:14px}
button,.btn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink)}
button:hover,.btn:hover{background:#f5f5f4}
input,select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 0 0 1px var(--line);margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 0 0 1px var(--line)}
.kpi small{color:var(--sub);display:block}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums}
.gauge{height:12px;background:#f1f0ee;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.gauge i{display:block;height:100%;border-radius:99px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.sub{color:var(--sub);font-size:12px}
.n{font-variant-numeric:tabular-nums;text-align:right}
.li{display:flex;justify-content:space-between;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer}
.li:hover{background:#fafaf9}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px;font-size:14px}
th{text-align:left;color:var(--sub);font-weight:500;font-size:12px;padding:4px}
td{border-top:1px solid var(--line);padding:3px}
td input,td select{width:100%;border-color:transparent;background:transparent}
td input:focus{background:#fff;border-color:var(--line)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal .box{background:#fff;border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:80vh;overflow:auto}
#busy{background:#fffbeb;color:#92400e;border-radius:10px;padding:8px 12px;margin-bottom:12px;display:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.form label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.form input,.form select{width:100%}
.form .full{grid-column:1/-1}
.pri{background:#292524;color:#fff;border-color:#292524}.pri:hover{background:#44403c}
.red{color:var(--bad)}.green{color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="row"><h1>우리 부부 가계부</h1><input type="month" id="month" onchange="setMonth(this.value)"><span id="sync" class="sub"></span></div>
    <div class="row">
      <button class="pri" onclick="openForm()">+ 직접 입력</button>
      <label class="btn">카드 명세서 (사진/엑셀)<input type="file" accept="image/*,.xlsx,.xls,.csv" multiple hidden onchange="upload(this,'card')"></label>
      <label class="btn">통장 캡처 (사진/엑셀)<input type="file" accept="image/*,.xlsx,.xls,.csv" multiple hidden onchange="upload(this,'bank')"></label>
      <button onclick="loadFixed()">지난달 고정 내역 불러오기</button>
      <button onclick="reclass()">기타 자동분류</button>
      <button onclick="dedupeExisting()">중복 정리</button>
      <button onclick="sample()">샘플 데이터</button>
      <button onclick="keyBox()">API 키</button>
      <button onclick="roomBox()">방 코드</button>
      <button onclick="backup()">백업</button>
      <label class="btn">복원<input type="file" accept=".json" hidden onchange="restore(this)"></label>
    </div>
  </div>
  <div id="busy"></div>
  <div id="app"></div>
</div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="mbox"></div></div>

 [/항공|아시아나|제주항공|진에어|티웨이|에어부산|호텔|리조트|펜션|숙박|모텔|야놀자|여기어때|에어비앤비|AIRBNB|아고다|AGODA|부킹닷컴|BOOKING|코레일|KORAIL|KTX|SRT|고속버스|버스터미널|렌터카|쏘카|그린카|면세|트립|투어|관광|스키장|워터파크|캠핑|글램핑|여행/i,'여행'],
 [/주유|GS칼텍스|SK에너지|S-?OIL|에쓰오일|현대오일뱅크|알뜰주유|충전소|주차|파킹|택시|카카오\s?T|티머니|T-?MONEY|버스|지하철|교통|하이패스|통행료|도로공사|세차|자동차|정비|타이어|카센터/i,'교통비'],
 [/영화|CGV|메가박스|롯데시네마|당구|볼링|스크린골프|골프|노래|PC방|피씨방|오락|게임|STEAM|스팀|플레이스테이션|닌텐도|방탈출|보드게임|만화|도서|교보문고|영풍문고|알라딘|예스24|YES24|서점|공연|콘서트|티켓|인터파크|전시|박물관|미술관|동물원|수족관|놀이공원|에버랜드|롯데월드|찜질|사우나|스파(?!오)|헬스|피트니스|필라테스|요가|수영|클라이밍|탁구|테니스|배드민턴|체육|스포츠|낚시|키즈카페|뮤지컬|연극|문화/i,'문화생활'],
 [/유니클로|UNIQLO|ZARA|자라(?!섬)|H&M|무신사|지그재그|에이블리|스파오|탑텐|8세컨|뉴발란스|나이키|NIKE|아디다스|ADIDAS|(?<![A-Za-z])LF|이랜드|패션|의류|슈즈|신발|미용실|헤어|네일|뷰티|에스테틱|피부관리|안경|렌즈|쥬얼리|악세사리|가방|백화점/i,'꾸밈'],

];
const ruleCat=n=>{const r=RULES.find(x=>x[0].test(n));return r?r[1]:null};
const guess=n=>ruleCat(n)||'기타';

/* ===== 상태 ===== */
const d0=new Date();
let month=localStorage.getItem('month')||`${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,'0')}`;
let tx=[];try{tx=JSON.parse(localStorage.getItem('ledger')||'[]').filter(x=>x&&x.id&&typeof x.date==='string'&&/^\d{4}-\d{2}/.test(x.date))}catch(e){tx=[]}
let apiKey=localStorage.getItem('gkey')||'';
let sel=[], charts=[];
let view=localStorage.getItem('view')||'date',dir=localStorage.getItem('dir')||'desc';
function setView(v){if(v==='date'&&view==='date')dir=dir==='desc'?'asc':'desc';else view=v;localStorage.setItem('view',view);localStorage.setItem('dir',dir);render()}
const save=()=>{try{localStorage.setItem('ledger',JSON.stringify(tx))}catch(e){}};

/* ===== Firestore 동기화 ===== */
let db=null,unsub=null,room=localStorage.getItem('room')||'0314';
const fbOn=()=>!!(firebaseConfig.apiKey&&firebaseConfig.projectId);
const col=()=>db.collection('rooms').doc(room).collection('tx');
const setSync=t=>{const e=document.getElementById('sync');if(e)e.textContent=t};
const saveKey=k=>{apiKey=k;localStorage.setItem('gkey',k);if(db&&room)db.collection('rooms').doc(room).set({gkey:k},{merge:true}).catch(e=>alert('키를 공유 방에 저장하지 못했어요('+e.code+'). 이 기기에서는 사용 가능해요. Firestore 규칙을 확인해 주세요.'))};
const validTx=x=>!!(x&&x.id&&typeof x.date==='string'&&/^\d{4}-\d{2}/.test(x.date));
const fixTx=x=>({id:String(x.id),date:x.date,name:String(x.name==null?'':x.name),amount:+x.amount||0,cat:ALL.includes(x.cat)?x.cat:'기타',memo:String(x.memo||''),rec:!!x.rec});
const clean=t=>JSON.parse(JSON.stringify(t));
function put(t){
  const i=tx.findIndex(x=>x.id===t.id);if(i<0)tx.push(t);else tx[i]=t;save();
  if(db&&room){try{col().doc(t.id).set(clean(t)).catch(e=>setSync('🔴 저장 실패: '+e.code))}catch(e){setSync('🔴 저장 실패: '+e.message)}}
}
function rmv(id){
  tx=tx.filter(x=>x.id!==id);save();
  if(db&&room){try{col().doc(id).delete().catch(e=>setSync('🔴 삭제 실패: '+e.code))}catch(e){setSync('🔴 삭제 실패: '+e.message)}}
}
function roomBox(){
  if(!fbOn())return alert('firebaseConfig 설정값을 확인해 주세요.');
  const r=prompt('부부가 함께 쓸 방 코드를 입력하세요.',room);
  if(r!==null){room=r.trim();localStorage.setItem('room',room);connect()}
}
function autoMonth(){ // 이번 달에 내역이 없으면, 내역이 있는 가장 최근 달로 자동 이동
  if(!cur().length&&tx.length){const ms=[...new Set(tx.map(t=>t.date.slice(0,7)))].sort();month=ms[ms.length-1];localStorage.setItem('month',month)}
}
function connect(){
  if(unsub){unsub();unsub=null}
  if(!fbOn()){setSync('💾 이 기기에만 저장 중');return}
  if(!room){setSync('방 코드를 입력하면 공유돼요');return}
  try{
    if(!db){firebase.initializeApp(firebaseConfig);db=firebase.firestore()}
    let firstDone=false;setSync('연결 중…');
    db.collection('rooms').doc(room).onSnapshot(d=>{if(d.exists&&d.data().gkey){apiKey=d.data().gkey;localStorage.setItem('gkey',apiKey)}},()=>{});
    unsub=col().onSnapshot(s=>{
      const remote=s.docs.map(d=>({...d.data(),id:d.data().id||d.id})).filter(validTx).map(fixTx);
      const rid=new Set(remote.map(x=>x.id)),flag='synced_'+room,seen=localStorage.getItem(flag)==='1';
      const localOnly=tx.filter(x=>!rid.has(x.id));
      // 이 기기 내역은 절대 지우지 않아요: 처음 연결하거나 공유 방이 비어 있으면 이 기기 내역을 공유 방에 올려요
      if(localOnly.length&&(!seen||!remote.length)){
        localOnly.forEach(x=>{try{col().doc(x.id).set(clean(x)).catch(()=>{})}catch(e){}});
        tx=[...remote,...localOnly];
      }else tx=remote;
      localStorage.setItem(flag,'1');save();
      if(!firstDone){firstDone=true;autoMonth()}

  if(!dups.length)return alert('겹치는 내역이 없어요.');
  if(!confirm(`같은 날짜·같은 금액·같은 가맹점이 겹친 ${dups.length}건을 삭제할까요?\n예) ${dups.slice(0,3).map(t=>t.date.slice(5)+' '+t.name+' '+won(t.amount)).join(' / ')}\n\n※ 같은 곳에서 같은 날 같은 금액을 실제로 두 번 쓴 경우도 지워져요. 걱정되면 먼저 [백업]을 받아 두세요.`))return;
  dups.forEach(t=>rmv(t.id));render();alert(`${dups.length}건을 정리했어요.`);
}
async function reclass(){
  const rows=cur().filter(t=>t.cat==='기타'&&t.amount>0);let n=0;
  rows.forEach(t=>{const c=ruleCat(t.name);if(c){t.cat=c;put(t);n++}});
  const left=rows.filter(t=>t.cat==='기타');
  if(left.length&&apiKey){await aiFill(left,'card');left.forEach(t=>{if(t.cat!=='기타'){put(t);n++}})}
  render();alert(`${n}건을 자동 분류했어요.`+(left.length&&!apiKey?'\n(남은 항목은 API 키가 있으면 AI가 분류해요)':''));
}
let hideT=null;
async function upload(inp,kind){
  const files=[...inp.files];inp.value='';if(!files.length)return;
  const busy=document.getElementById('busy'),isX=f=>/\.(xlsx|xls|csv)$/i.test(f.name);
  const say=(t,keep)=>{busy.style.display='block';busy.textContent=t;clearTimeout(hideT);if(!keep)hideT=setTimeout(()=>{busy.style.display='none'},12000)};
  const rows=[],warn=[];
  try{
    if(!apiKey&&files.some(f=>!isX(f)))keyBox();
    let idx=0,done=0;
    const worker=async()=>{ // 3개씩 동시에 처리
      while(idx<files.length){
        const fi=idx++,f=files[fi];
        try{
          let got;
          if(isX(f))got=await parseSheet(f,kind,warn);
          else{if(!apiKey)throw new Error('API 키가 필요해요');got=await parseImage(f,kind,warn)}
          got.forEach(r=>r._f=fi);rows.push(...got);
        }catch(e){warn.push(`${f.name}: ${e.message}`)}
        say(`${++done}/${files.length} 완료…`,true);
      }
    };
    say(`0/${files.length} 분석 중…`,true);
    await Promise.all([worker(),worker(),worker()]);
    // 중복 제외: '같은 날짜 + 같은 금액'이면 같은 건으로 봐요 (가맹점 표기가 달라도 걸러져요)
    // - 이미 저장된 개수만큼은 제외, 한 파일 안의 같은 금액 여러 건은 실제 여러 번 결제로 보고 유지
    // - 서로 다른 파일(겹쳐 찍은 캡처)에 같은 건이 있으면 한 번만 인정
    const dk=r=>`${r.date}|${r.amount}`,have={},per={};
    tx.forEach(t=>{const k=dk(t);have[k]=(have[k]||0)+1});
    rows.forEach(r=>{const k=dk(r);per[k]=per[k]||{};per[k][r._f]=(per[k][r._f]||0)+1});
    const allow={};Object.keys(per).forEach(k=>{allow[k]=Math.max(0,Math.max(...Object.values(per[k]))-(have[k]||0))});
    const fresh=[];rows.forEach(r=>{const k=dk(r);if(allow[k]>0){allow[k]--;fresh.push(r)}});
    const dup=rows.length-fresh.length;fresh.forEach(r=>delete r._f);
    fresh.forEach(put);
    if(fresh.length){const c={};fresh.forEach(r=>{const m=r.date.slice(0,7);c[m]=(c[m]||0)+1});month=Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0];localStorage.setItem('month',month)}
    render();
    say(`✅ ${fresh.length}건 추가${dup?` · 이미 있는 ${dup}건 제외`:''}${fresh.length?` · ${month} 로 이동`:''}`);
    // 화면에 먼저 보여주고, 분류가 애매한 건 AI가 뒤에서 보강
    const need=fresh.filter(r=>r.cat==='기타');
    if(need.length&&apiKey&&kind!=='bank'){
      say(`✅ ${fresh.length}건 추가 · AI가 분류 보강 중…`,true);
      aiFill(need,kind).then(()=>{let n=0;need.forEach(r=>{if(r.cat!=='기타'){put(r);n++}});render();say(`✅ ${fresh.length}건 추가 · AI가 ${n}건 분류 보강`)});
    }
  }catch(e){say('⚠️ '+e.message);warn.push(e.message)}
  if(warn.length)alert('확인이 필요해요:\n\n'+[...new Set(warn)].join('\n\n'));
}

/* ===== 직접 입력 ===== */
function openForm(){
  const t=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),d=t.startsWith(month)?t:month+'-01';
  document.getElementById('mbox').innerHTML=`<b style="font-size:16px">직접 입력</b>
  <div class="form">
    <div><label>날짜</label><input type="date" id="f_date" value="${d}"></div>
    <div><label>구분</label><select id="f_grp" onchange="fGrp()">${Object.keys(G).map(k=>`<option value="${k}" ${k==='living'?'selected':''}>${G[k].l}</option>`).join('')}</select></div>
    <div><label>세부 항목</label><select id="f_cat"></select></div>
    <div><label>금액 (원)</label><input type="number" id="f_amt" inputmode="numeric" placeholder="0"></div>
    <div class="full"><label>내용 (가맹점)</label><input id="f_name" placeholder="예: 이마트"></div>
    <div class="full"><label>메모</label><input id="f_memo" placeholder="선택"></div>
    <div class="full"><label style="display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" id="f_rec" style="width:auto"> 매월 반복 (다음 달에 ‘고정 내역 불러오기’로 가져와요)</label></div>
  </div>
  <div class="row" style="justify-content:flex-end"><button onclick="closeModal()">취소</button><button onclick="saveForm(true)">저장 후 계속</button><button class="pri" onclick="saveForm(false)">저장</button></div>`;
  fGrp();document.getElementById('modal').style.display='flex';setTimeout(()=>document.getElementById('f_name').focus(),50);
}
function fGrp(){const g=document.getElementById('f_grp').value;
  document.getElementById('f_cat').innerHTML=G[g].c.map(c=>`<option>${c}</option>`).join('');
  document.getElementById('f_rec').checked=['income','saving','fixed'].includes(g)}
function saveForm(keep){
  const v=i=>document.getElementById(i).value,date=v('f_date'),name=v('f_name').trim(),amount=Math.abs(+v('f_amt')||0);
  if(!date)return alert('날짜를 선택해 주세요.');if(!name)return alert('내용(가맹점)을 입력해 주세요.');if(!amount)return alert('금액을 입력해 주세요.');
  put({id:uid(),date,name,amount,cat:v('f_cat'),memo:v('f_memo').trim(),rec:document.getElementById('f_rec').checked});
  month=date.slice(0,7);sel=[];render();
  if(keep){openForm();document.getElementById('f_date').value=date}else closeModal();
}

/* ===== 모달 (드릴다운) ===== */
function openCat(cat){const rows=cur().filter(t=>t.cat===cat),m={};rows.forEach(t=>m[t.name]=(m[t.name]||0)+t.amount);
  const ms=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  document.getElementById('mbox').innerHTML=`<div class="row" style="justify-content:space-between"><b>${cat} · ${won(sum(rows))}</b><button onclick="closeModal()">닫기</button></div>
  <p class="sub">가맹점별 합계</p>${ms.map(([n,v])=>`<div class="li" style="cursor:default"><span>${esc(n)}</span><span class="n">${won(v)}</span></div>`).join('')||'<p class="sub">이 달 내역이 없어요.</p>'}
  <p class="sub" style="margin-top:14px">상세 내역</p>${rows.map(t=>`<div class="li" style="cursor:default"><span class="sub">${t.date.slice(5)}</span><span style="flex:1;margin:0 8px">${esc(t.name)}</span><span class="n">${won(t.amount)}</span></div>`).join('')}`;
  document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
let irrOpen=false;function toggleIrr(){irrOpen=!irrOpen;render()}

/* ===== 렌더 ===== */
function render(){
  try{renderMain()}catch(e){console.error(e);
    document.getElementById('app').innerHTML='<div class="card"><b class="red">화면을 그리는 중 오류가 났어요</b><div class="sub" style="margin:6px 0">'+esc(e.message)+'</div><p class="sub">내역은 지워지지 않았어요. 먼저 백업을 받아 두세요.</p><button onclick="backup()">백업 저장</button></div>'}
}
function rowHtml(t){return `<tr><td><input type="checkbox" ${sel.includes(t.id)?'checked':''} onchange="tog('${t.id}',this.checked)" style="width:auto"></td>
    <td><input type="date" value="${t.date}" onchange="upd('${t.id}','date',this.value)"></td>
    <td><input value="${esc(t.name)}" onchange="upd('${t.id}','name',this.value)"></td>
    <td><select onchange="upd('${t.id}','cat',this.value)">${Object.values(G).map(g=>`<optgroup label="${g.l}">${g.c.map(k=>`<option ${k===t.cat?'selected':''}>${k}</option>`).join('')}</optgroup>`).join('')}</select></td>
    <td><input type="number" class="n" value="${t.amount}" onchange="upd('${t.id}','amount',this.value)"></td>
    <td><input value="${esc(t.memo)}" placeholder="메모" onchange="upd('${t.id}','memo',this.value)"></td>
    <td><input type="checkbox" ${t.rec?'checked':''} onchange="upd('${t.id}','rec',this.checked)" style="width:auto"></td></tr>`}
function listRows(c){
  const byDate=(a,b)=>dir==='asc'?a.date.localeCompare(b.date):b.date.localeCompare(a.date);
  if(view==='date')return c.slice().sort(byDate).map(rowHtml).join('');
  let out='';  // 항목별: 구분 순서대로 묶고, 항목마다 소계를 보여줘요 (안은 최신순)
  for(const g of Object.keys(G))for(const k of G[g].c){
    const rs=c.filter(t=>t.cat===k).sort((a,b)=>b.date.localeCompare(a.date));if(!rs.length)continue;
    out+=`<tr><td colspan="7" style="background:#f5f5f4;border-top:1px solid var(--line);padding:7px 8px"><b>${G[g].l} › ${k}</b> <span class="sub">${rs.length}건 · ${won(sum(rs))}</span></td></tr>`+rs.map(rowHtml).join('');
  }
  return out;
}
function emptyMsg(){
  const ms=[...new Set(tx.map(t=>t.date.slice(0,7)))].sort().reverse();
  return '<div class="sub" style="text-align:center;padding:24px">이 달 내역이 없어요.'+(ms.length?'<div style="margin-top:10px">다른 달에 저장된 내역이 있어요 — 눌러서 이동:</div><div class="row" style="justify-content:center;margin-top:8px">'+ms.map(m=>`<button onclick="setMonth('${m}')">${m} (${tx.filter(t=>t.date.startsWith(m)).length}건)</button>`).join('')+'</div>':'<br>명세서를 올리거나 ‘샘플 데이터’를 눌러 보세요.')+'</div>';
}
function renderMain(){
  document.getElementById('month').value=month;
  const c=cur(),by=g=>c.filter(t=>grp(t.cat)===g);
  const inc=sum(by('income')),sav=sum(by('saving')),exp=sum(c.filter(t=>isExp(t.cat))),sur=inc-sav-exp,liv=sum(by('living')),irr=sum(by('irregular'));
  const pct=Math.min(100,liv/BUDGET*100),over=liv>BUDGET;
  const gc=over?'var(--bad)':pct>85?'var(--warn)':'var(--ok)';
  document.getElementById('app').innerHTML=`
  <div class="kpis">
    <div class="kpi"><small>총 수입</small><b>${won(inc)}</b></div>
    <div class="kpi"><small>총 저축 · 저축률 ${inc?Math.round(sav/inc*100):0}%</small><b>${won(sav)}</b></div>
    <div class="kpi"><small>총 지출</small><b>${won(exp)}</b></div>
    <div class="kpi"><small>잉여 현금 (목표 0원)</small><b class="${sur<0?'red':'green'}">${won(sur)}</b></div>
  </div>
  <div class="card"><div class="row" style="justify-content:space-between"><div><b>식비 + 생활용품 통합 예산</b><div class="sub">월 ${won(BUDGET)}</div></div>
    <div class="n"><b style="font-size:18px">${won(liv)}</b><div class="sub ${over?'red':''}">${over?won(liv-BUDGET)+' 초과':won(BUDGET-liv)+' 남음'}</div></div></div>
    <div class="gauge"><i style="width:${pct}%;background:${gc}"></i></div>
    <div class="sub">${G.living.c.map(k=>`${k} ${won(sum(c.filter(t=>t.cat===k)))}`).join(' · ')}</div></div>
  <div class="card"><div class="row" style="justify-content:space-between;cursor:pointer" onclick="toggleIrr()"><div><b>비정기 지출</b><div class="sub">탭해서 가맹점별 내역 보기</div></div><b>${won(irr)} ${irrOpen?'▲':'▼'}</b></div>
    ${irrOpen?G.irregular.c.map(k=>`<div class="li" onclick="openCat('${k}')"><span>${k}</span><span class="n">${won(sum(c.filter(t=>t.cat===k)))}</span></div>`).join(''):''}</div>
  <div class="grid2"><div class="card"><b>항목별 지출 순위</b><canvas id="c1" height="220"></canvas></div>
    <div class="card"><b>월별 지출 추이</b><canvas id="c2" height="220"></canvas></div></div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="row"><b>${month} 내역 (${c.length}건)</b>
      <button class="${view==='date'?'pri':''}" onclick="setView('date')">날짜순 ${view==='date'?(dir==='desc'?'▼ 최신순':'▲ 오래된순'):''}</button>
      <button class="${view==='cat'?'pri':''}" onclick="setView('cat')">항목별</button></div>
    <div class="row"><button onclick="add()">추가</button><button onclick="merge()">합치기</button><button onclick="del(sel)">선택 삭제</button><button onclick="exportFile('xlsx')">Excel</button><button onclick="exportFile('csv')">CSV</button></div></div>
    <div class="tw"><table><tr><th></th><th>날짜</th><th>내용</th><th>항목</th><th>금액</th><th>메모</th><th>매월반복</th></tr>
    ${listRows(c)}</table>
    ${c.length?'':emptyMsg()}</div></div>`;
  drawCharts(c);
}
function drawCharts(c){
  if(typeof Chart==='undefined')return;
  charts.forEach(x=>x.destroy());charts=[];
  const m={};c.filter(t=>isExp(t.cat)).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amount);
  const r=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  charts.push(new Chart(document.getElementById('c1'),{type:'bar',data:{labels:r.map(x=>x[0]),datasets:[{data:r.map(x=>x[1]),backgroundColor:'#f59e0b',borderRadius:6}]},
    options:{indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>won(i.raw)}}},scales:{x:{display:false},y:{grid:{display:false}}}}}));
  const ms=[...new Set(tx.map(t=>t.date.slice(0,7)))].sort();
  charts.push(new Chart(document.getElementById('c2'),{type:'bar',
    data:{labels:ms.map(x=>x.slice(5)+'월'),datasets:['fixed','living','irregular','transport','etc'].map(g=>({label:G[g].l,backgroundColor:COL[g],data:ms.map(x=>sum(tx.filter(t=>t.date.startsWith(x)&&grp(t.cat)===g)))}))},
    options:{plugins:{tooltip:{callbacks:{label:i=>`${i.dataset.label} ${won(i.raw)}`}}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,ticks:{callback:v=>v/10000+'만'}}}}}));
}
autoMonth();render();connect();
</script>
