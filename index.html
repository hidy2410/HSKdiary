<!DOCTYPE html>
<html lang="ko">
<head>

<style>
:root{--bg:#f6f5f3;--card:#fff;--ink:#292524;--sub:#78716c;--line:#e7e5e4;--ok:#059669;--bad:#e11d48;--warn:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif;padding:16px 16px 80px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:20px;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn,input,select{font:inherit;font-size:14px}
button,.btn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink)}
button:hover,.btn:hover{background:#f5f5f4}
input,select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 0 0 1px var(--line);margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 0 0 1px var(--line)}
.kpi small{color:var(--sub);display:block}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums}
.gauge{height:12px;background:#f1f0ee;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.gauge i{display:block;height:100%;border-radius:99px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.sub{color:var(--sub);font-size:12px}
.n{font-variant-numeric:tabular-nums;text-align:right}
.li{display:flex;justify-content:space-between;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer}
.li:hover{background:#fafaf9}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px;font-size:14px}
th{text-align:left;color:var(--sub);font-weight:500;font-size:12px;padding:4px}
td{border-top:1px solid var(--line);padding:3px}
td input,td select{width:100%;border-color:transparent;background:transparent}
td input:focus{background:#fff;border-color:var(--line)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal .box{background:#fff;border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:80vh;overflow:auto}
#busy{background:#fffbeb;color:#92400e;border-radius:10px;padding:8px 12px;margin-bottom:12px;display:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.form label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.form input,.form select{width:100%}
.form .full{grid-column:1/-1}
.pri{background:#292524;color:#fff;border-color:#292524}.pri:hover{background:#44403c}
.red{color:var(--bad)}.green{color:var(--ok)}
</style>
</head>

      <button onclick="roomBox()">방 코드</button>

  <div id="busy"></div>
  <div id="app"></div>
</div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="mbox"></div></div>

const ruleCat=n=>{const r=RULES.find(x=>x[0].test(n));return r?r[1]:null};
const guess=n=>ruleCat(n)||'기타';

/* ===== 상태 ===== */
const d0=new Date();
let month=`${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,'0')}`;
let tx=JSON.parse(localStorage.getItem('ledger')||'[]');
let apiKey=localStorage.getItem('gkey')||'';
let sel=[], charts=[];
const save=()=>localStorage.setItem('ledger',JSON.stringify(tx));

/* ===== Firestore 동기화 ===== */
let db=null,unsub=null,room=localStorage.getItem('room')||'0314';
const fbOn=()=>!!(firebaseConfig.apiKey&&firebaseConfig.projectId);
const col=()=>db.collection('rooms').doc(room).collection('tx');
const setSync=t=>{const e=document.getElementById('sync');if(e)e.textContent=t};
const saveKey=k=>{apiKey=k;localStorage.setItem('gkey',k);if(db&&room)db.collection('rooms').doc(room).set({gkey:k},{merge:true}).catch(e=>alert('키를 공유 방에 저장하지 못했어요('+e.code+'). 이 기기에서는 사용 가능해요. Firestore 규칙을 확인해 주세요.'))};
function put(t){const i=tx.findIndex(x=>x.id===t.id);if(i<0)tx.push(t);else tx[i]=t;save();if(db&&room)col().doc(t.id).set(t).catch(e=>setSync('🔴 저장 실패: '+e.code))}
function rmv(id){tx=tx.filter(x=>x.id!==id);save();if(db&&room)col().doc(id).delete().catch(e=>setSync('🔴 삭제 실패: '+e.code))}
function roomBox(){
  if(!fbOn())return alert('firebaseConfig 설정값을 확인해 주세요.');
  const r=prompt('부부가 함께 쓸 방 코드를 입력하세요.',room);
  if(r!==null){room=r.trim();localStorage.setItem('room',room);connect()}
}
function connect(){
  if(unsub){unsub();unsub=null}
  if(!fbOn()){setSync('💾 이 기기에만 저장 중');return}
  if(!room){setSync('방 코드를 입력하면 공유돼요');return}
  try{
    if(!db){firebase.initializeApp(firebaseConfig);db=firebase.firestore()}
    let first=true;setSync('연결 중…');
    db.collection('rooms').doc(room).onSnapshot(d=>{if(d.exists&&d.data().gkey){apiKey=d.data().gkey;localStorage.setItem('gkey',apiKey)}},()=>{});
    unsub=col().onSnapshot(s=>{
      if(first){first=false;
        if(s.empty&&tx.length&&confirm(`이 기기의 기존 내역 ${tx.length}건을 공유 가계부 "${room}"에 올릴까요?`)){tx.slice().forEach(put);setSync('🟢 실시간 동기화 중');return}}
      tx=s.docs.map(d=>d.data());save();render();setSync('🟢 실시간 동기화 중');
    },e=>setSync('🔴 연결 실패('+e.code+') — 규칙·설정값을 확인하세요'));
  }catch(e){setSync('🔴 설정 오류: '+e.message)}
}
const cur=()=>tx.filter(t=>t.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date));
const sum=a=>a.reduce((s,t)=>s+t.amount,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setMonth(v){if(v){month=v;sel=[];render()}}
function upd(id,k,v){const t=tx.find(x=>x.id===id);t[k]=k==='amount'?+v||0:k==='rec'?!!v:v;put(t);render()}
function del(ids){ids.forEach(rmv);sel=[];render()}
function add(){put({id:uid(),date:month+'-01',name:'새 항목',amount:0,cat:'기타',memo:'',rec:false});render()}
function tog(id,on){sel=on?[...sel,id]:sel.filter(i=>i!==id)}
function merge(){const r=cur().filter(t=>sel.includes(t.id));if(r.length<2)return alert('합칠 항목을 2개 이상 선택하세요.');
  const [a,...rest]=r;a.name=`${a.name} 외 ${rest.length}건`;a.amount=sum(r);put(a);del(rest.map(x=>x.id))}
function sample(){const m=month,P=(d,name,amount,cat,rec)=>({id:uid(),date:`${m}-${d}`,name,amount,cat,memo:'',rec});
  [P('01','급여',3800000,'주수입',1),P('10','청약',200000,'청약',1),P('10','적금',500000,'적금',1),P('05','대출이자',650000,'대출이자',1),
  P('07','통신비',89000,'통신비',1),P('25','관리비',180000,'관리비',1),P('03','쿠팡',182400,'식비'),P('08','이마트',214300,'식비'),P('12','다이소',38600,'생활용품'),
  P('15','유니클로',429200,'꾸밈'),P('16','LF스퀘어',453908,'꾸밈'),P('18','모던하우스',87000,'꾸밈'),P('20','○○내과',32000,'건강'),P('22','CGV',28000,'문화생활')].forEach(put);render()}
function loadFixed(){const [y,m]=month.split('-').map(Number),pm=`${m===1?y-1:y}-${String(m===1?12:m-1).padStart(2,'0')}`,last=new Date(y,m,0).getDate(),c=cur();

const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
function keyBox(){const k=prompt('Gemini API 키를 입력하세요 (공유 방에 자동 저장돼요)',apiKey);if(k!==null)saveKey(k.trim())}
const MODELS=['gemini-3.6-flash','gemini-3.5-flash','gemini-2.5-flash'];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const T=t=>({type:t});
const SCHEMA={type:'OBJECT',properties:{rows:{type:'ARRAY',items:{type:'OBJECT',properties:{date:T('STRING'),name:T('STRING'),amount:T('INTEGER'),cat:T('STRING')},required:['date','name','amount','cat']}},printed_total:{type:'INTEGER',nullable:true}},required:['rows']};
const SCHEMA_CATS={type:'ARRAY',items:{type:'OBJECT',properties:{name:T('STRING'),cat:T('STRING')},required:['name','cat']}};
let useSchema=true;
async function gem(parts,schema){
  let lastErr='';
  for(const m of MODELS){
    for(let a=0;a<3;a++){
      const cfg={temperature:0,maxOutputTokens:16384,responseMimeType:'application/json'};
      if(useSchema&&schema)cfg.responseSchema=schema;
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,
        {method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:cfg})});
      if(r.ok){const j=await r.json();const c=j.candidates&&j.candidates[0];if(!c||!c.content)throw new Error('모델이 결과를 돌려주지 않았어요 (이미지가 차단되었을 수 있어요)');return c.content.parts.map(p=>p.text||'').join('').replace(/```json|```/g,'')}
      const b=await r.json().catch(()=>({}));lastErr=`${r.status} ${(b.error&&b.error.message)||''}`;
      if(r.status===400&&useSchema&&schema){useSchema=false;a--;continue}
      if(r.status===404)break;
      if(r.status===429||r.status>=500){await sleep(2500*(a+1));continue}
      throw new Error(lastErr);
    }
  }
  throw new Error(lastErr);
}
/* --- 분류 보조: 내가 고쳐둔 가맹점 분류를 기억해서 다음에도 적용 --- */
const known=()=>{const m={};tx.forEach(t=>{if(t.cat!=='기타')m[t.name]=t.cat});return m};
const BANK=[[/적금/,'적금'],[/청약/,'청약'],[/대출|이자/,'대출이자'],[/통신|KT|SKT|LGU|올레/i,'통신비'],[/관리비/,'관리비'],[/정수기|코웨이/,'정수기'],[/용돈/,'용돈'],[/넷플|유튜브|구독|멜론|와우/,'구독료']];
const bankCat=n=>(BANK.find(r=>r[0].test(n))||[0,0])[1]||guess(n);
function normDate(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const s=String(v).trim();let m=s.match(/(\d{4})\D?(\d{1,2})\D?(\d{1,2})/);
  if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})\D(\d{1,2})/);
  return m?`${month.slice(0,4)}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`:'';
}
const num=v=>{const n=parseFloat(String(v).replace(/[^\d.-]/g,''));return isNaN(n)?0:n};
/* --- 사진 --- */
const ocrPrompt=kind=>`너는 한국 가계부 OCR 전문가다. 첨부된 것은 ${kind==='card'?'카드 이용내역 명세서':'통장 입출금/자동이체 내역'}다.
규칙:
1. 보이는 모든 거래 행을 위에서 아래 순서로 빠짐없이 추출한다. 한 줄도 건너뛰거나 요약·합치지 않는다.
2. date: YYYY-MM-DD. 연도가 없으면 ${month.slice(0,4)}년으로 한다.
3. name: 가맹점/적요를 보이는 그대로.
4. amount: ${kind==='card'?'할인·포인트 차감 전 실제 결제 원금(할부는 이번 청구분). 양의 정수. 취소/환불 행은 음수.':'입금·출금 모두 부호 없는 양의 정수.'} 쉼표와 '원'은 뺀다. 숫자 자릿수를 특히 정확히 읽는다.
5. cat은 반드시 다음 중 하나: ${(kind==='card'?ALL.filter(isExp):ALL).join(', ')}.${kind==='bank'?' 급여 입금은 주수입, 적금·청약은 저축 항목, 그 외 정기 출금은 고정지출 항목.':''}
6. 이미지에 총 이용금액/청구금액 합계가 인쇄돼 있으면 printed_total에 넣고, 없으면 null.
${CAT_GUIDE}`;
function fromModel(txt,kind,fname,warn){
  const o=JSON.parse(txt),K=known(),list=Array.isArray(o)?o:(o.rows||[]);
  const rows=list.map(x=>{const nm=String(x.name||'').trim(),a=+x.amount||0;
    return{id:uid(),date:normDate(x.date),name:nm,amount:kind==='bank'?Math.abs(a):a,cat:K[nm]||ruleCat(nm)||(ALL.includes(x.cat)?x.cat:'기타'),memo:'',rec:kind==='bank'}}).filter(r=>r.date&&r.name&&r.amount);
  if(kind==='card'&&o.printed_total){const s=sum(rows);if(s!==o.printed_total)warn.push(`${fname}: 인쇄된 합계 ${won(o.printed_total)} ≠ 인식 합계 ${won(s)} (한 명세서를 여러 장으로 나눴다면 정상일 수 있어요. 아니라면 누락/오독 가능성이 있으니 확인하세요)`)}
  return rows;
}
async function parseImage(f,kind,warn){
  return fromModel(await gem([{text:ocrPrompt(kind)},{inline_data:{mime_type:f.type||'image/jpeg',data:await b64(f)}}],SCHEMA),kind,f.name,warn);
}
/* --- 엑셀/CSV --- */
async function readWb(f){
  const buf=await f.arrayBuffer();
  if(/\.csv$/i.test(f.name)){let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('euc-kr').decode(buf)}return XLSX.read(t,{type:'string'})}
  return XLSX.read(buf,{type:'array'});
}
function findHeader(rows){
  const fc=(h,re,ex)=>h.findIndex(c=>re.test(c)&&!(ex&&ex.test(c)));
  for(let i=0;i<Math.min(rows.length,40);i++){
    const h=rows[i].map(c=>String(c).replace(/\s/g,''));
    const d=fc(h,/이용일|거래일|승인일|결제일|일자|날짜|일시/),n=fc(h,/가맹점|이용처|이용내역|적요|내용|거래처|상호|사용처|기재|거래기록/);
    if(d<0||n<0)continue;
    const ex=/할인|수수료|이자|잔액|포인트|누적|적립|개월/;let a=-1;
    for(const re of [/결제원금/,/이용금액/,/승인금액/,/청구금액/,/결제금액/,/금액/]){a=fc(h,re,ex);if(a>=0)break}
    const dep=fc(h,/입금|받은금액/),wd=fc(h,/출금|보낸금액|지급|찾으신/);
    if(a>=0||dep>=0||wd>=0)return{i,d,n,a,dep,wd};
  }
  return null;
}
function sheetRows(rows,kind){
  const H=findHeader(rows);if(!H)return null;const K=known(),out=[];
  for(const r of rows.slice(H.i+1)){
    const date=normDate(r[H.d]),name=String(r[H.n]).trim();
    if(!date||!name||/합계|총계|소계/.test(name))continue;
    let amount,cat;
    if(kind==='card'){amount=num(r[H.a>=0?H.a:H.wd]);if(!amount)continue;cat=K[name]||guess(name)}
    else{const dep=H.dep>=0?num(r[H.dep]):0,wd=H.wd>=0?num(r[H.wd]):0,one=H.a>=0?num(r[H.a]):0;
      if(dep>0){amount=dep;cat=/급여|월급/.test(name)?'주수입':'부수입'}
      else{amount=Math.abs(wd||one);if(!amount)continue;cat=K[name]||bankCat(name)}}
    out.push({id:uid(),date,name,amount,cat,memo:'',rec:kind==='bank'});
  }
  return out;
}
async function parseSheet(f,kind,warn){
  const wb=await readWb(f),out=[];let missed=false;
  for(const sn of wb.SheetNames){
    const ws=wb.Sheets[sn],rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:'yyyy-mm-dd',defval:''}),got=sheetRows(rows,kind);
    if(got){out.push(...got);continue}
    if(rows.length>1)missed=true;
    if(missed&&apiKey){ // 표 머리글을 못 찾으면 AI가 표를 읽어줌
      const csv=XLSX.utils.sheet_to_csv(ws).slice(0,60000);
      out.push(...fromModel(await gem([{text:ocrPrompt(kind)+'\n\n[첨부는 이미지 대신 표 데이터(CSV)]\n'+csv}],SCHEMA),kind,f.name+'('+sn+')',warn));missed=false;
    }
  }
  if(!out.length)throw new Error('이용일/가맹점/금액 열을 찾지 못했어요. (API 키가 있으면 AI가 대신 읽어요)');
  return out;
}
async function aiFill(rows,kind){ // 엑셀에서 분류 못한 가맹점을 AI가 한 번에 분류
  const names=[...new Set(rows.filter(r=>r.cat==='기타').map(r=>r.name))].slice(0,200);
  if(kind==='bank'||!names.length||!apiKey)return;
  try{
    const out=JSON.parse(await gem([{text:`다음 가맹점/적요 각각을 ${ALL.join(', ')} 중 하나로 분류해 [{name,cat}] 배열로 답해.\n${CAT_GUIDE}\n\n`+names.join('\n')}],SCHEMA_CATS));
    const m={};out.forEach(x=>{if(ALL.includes(x.cat))m[x.name]=x.cat});
    rows.forEach(r=>{if(r.cat==='기타'&&m[r.name])r.cat=m[r.name]});
  }catch(e){}
}
async function reclass(){

  render();alert(`${n}건을 자동 분류했어요.`+(left.length&&!apiKey?'\n(남은 항목은 API 키가 있으면 AI가 분류해요)':''));
}
async function upload(inp,kind){
  const files=[...inp.files];inp.value='';if(!files.length)return;

    <td><select onchange="upd('${t.id}','cat',this.value)">${Object.values(G).map(g=>`<optgroup label="${g.l}">${g.c.map(k=>`<option ${k===t.cat?'selected':''}>${k}</option>`).join('')}</optgroup>`).join('')}</select></td>
    <td><input type="number" class="n" value="${t.amount}" onchange="upd('${t.id}','amount',this.value)"></td>
    <td><input value="${esc(t.memo)}" placeholder="메모" onchange="upd('${t.id}','memo',this.value)"></td>
    <td><input type="checkbox" ${t.rec?'checked':''} onchange="upd('${t.id}','rec',this.checked)" style="width:auto"></td></tr>`).join('')}</table>
    ${c.length?'':'<p class="sub" style="text-align:center;padding:24px">내역이 없어요. 명세서를 올리거나 ‘샘플 데이터’를 눌러 보세요.</p>'}</div></div>`;
  drawCharts(c);
}
function drawCharts(c){
  charts.forEach(x=>x.destroy());charts=[];
  const m={};c.filter(t=>isExp(t.cat)).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amount);
  const r=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  charts.push(new Chart(document.getElementById('c1'),{type:'bar',data:{labels:r.map(x=>x[0]),datasets:[{data:r.map(x=>x[1]),backgroundColor:'#f59e0b',borderRadius:6}]},
    options:{indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>won(i.raw)}}},scales:{x:{display:false},y:{grid:{display:false}}}}}));
  const ms=[...new Set(tx.map(t=>t.date.slice(0,7)))].sort();
  charts.push(new Chart(document.getElementById('c2'),{type:'bar',
    data:{labels:ms.map(x=>x.slice(5)+'월'),datasets:['fixed','living','irregular','etc'].map(g=>({label:G[g].l,backgroundColor:COL[g],data:ms.map(x=>sum(tx.filter(t=>t.date.startsWith(x)&&grp(t.cat)===g)))}))},
    options:{plugins:{tooltip:{callbacks:{label:i=>`${i.dataset.label} ${won(i.raw)}`}}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,ticks:{callback:v=>v/10000+'만'}}}}}));
}
render();connect();
</script>
</body>
</html>
