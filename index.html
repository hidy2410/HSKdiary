<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리가족 오늘 메뉴 추천</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#F7F7F2;color:#212121;min-height:100vh}
/* 헤더 */
.hdr{background:#fff;border-bottom:1px solid #E8E8E0;padding:0 16px;position:sticky;top:0;z-index:100;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.hdr-in{max-width:800px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:52px}
.hdr h1{font-size:15px;font-weight:700;color:#2E7D32;display:flex;align-items:center;gap:7px}
.wpill{display:flex;align-items:center;gap:5px;padding:5px 11px;background:#E0F2F1;border-radius:20px;font-size:12px;color:#00695C;font-weight:500}
/* 탭 */
.tabs{background:#fff;border-bottom:1px solid #E8E8E0}
.tabs-in{max-width:800px;margin:0 auto;display:flex}
.tbtn{flex:1;padding:10px 2px;border:none;background:none;font-family:inherit;font-size:11px;color:#BDBDBD;cursor:pointer;border-bottom:2.5px solid transparent;transition:all .2s;font-weight:400;display:flex;flex-direction:column;align-items:center;gap:2px}
.tbtn i{font-size:17px}
.tbtn.on{color:#2E7D32;border-bottom-color:#2E7D32;font-weight:700}
/* 컨텐츠 */
.wrap{max-width:800px;margin:0 auto;padding:16px 14px 60px}
.pane{display:none}.pane.on{display:block}
/* 카드 */
.card{background:#fff;border:1px solid #EBEBEB;border-radius:14px;padding:16px;margin-bottom:14px}
.clabel{font-size:12px;font-weight:700;color:#9E9E9E;margin-bottom:11px;display:flex;align-items:center;gap:5px}
.clabel i{font-size:14px;color:#4CAF50}
/* 기분 */
.moods{display:flex;flex-wrap:wrap;gap:7px}
.mbtn{padding:7px 13px;border-radius:20px;border:1.5px solid #E0E0E0;background:#fff;font-size:13px;cursor:pointer;color:#616161;transition:all .15s;font-family:inherit}
.mbtn.on{background:#2E7D32;border-color:#2E7D32;color:#fff;font-weight:600}
/* 큰 버튼 */
.gbtn{width:100%;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;transition:all .2s}
.gbtn.gr{background:#2E7D32;color:#fff}.gbtn.gr:hover{background:#1B5E20}
.gbtn.or{background:#E65100;color:#fff}.gbtn.or:hover{background:#BF360C}
.gbtn:disabled{opacity:.45;cursor:not-allowed}
/* AI 결과 */
.res-wrap{animation:sup .35s ease;margin-top:16px}
@keyframes sup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.main-res{background:linear-gradient(135deg,#E8F5E9,#F1F8E9);border:1.5px solid #4CAF50;border-radius:16px;padding:18px;margin-bottom:12px}
.rbadge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:#4CAF50;color:#fff;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:9px}
.rname{font-size:24px;font-weight:700;color:#2E7D32;margin-bottom:7px}
.rreason{font-size:14px;color:#37474F;line-height:1.7;margin-bottom:11px}
.rtip{background:#fff;border-radius:10px;padding:10px 13px;font-size:13px;color:#546E7A;line-height:1.6;border-left:3px solid #4CAF50}
.rtip b{color:#2E7D32;display:block;margin-bottom:3px;font-size:12px}
.rmiss{font-size:12px;color:#E65100;margin-top:8px;display:flex;align-items:center;gap:4px}
.ytsec{margin-top:11px}
.ytlbl{font-size:12px;font-weight:600;color:#757575;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.ytlbl i{color:#FF0000;font-size:14px}
.ytrow{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid #EBEBEB;border-radius:10px;text-decoration:none;color:inherit;background:#fff;margin-bottom:5px;transition:border .15s}
.ytrow:hover{border-color:#FF0000}
.yticon{width:32px;height:22px;background:#FF0000;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.yticon i{color:#fff;font-size:14px}
.ytt{flex:1;min-width:0}
.ytt-t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ytt-s{font-size:11px;color:#9E9E9E;margin-top:1px}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.altcard{background:#fff;border:1px solid #EBEBEB;border-radius:12px;padding:12px;transition:all .15s}
.altcard:hover{border-color:#FF9800;background:#FFF3E0}
.altname{font-size:14px;font-weight:600;margin-bottom:3px}
.altrea{font-size:12px;color:#757575;line-height:1.5}
.tcard{background:#FFF3E0;border:1px solid #FFCC80;border-radius:12px;padding:13px;margin-top:4px}
.tbadge2{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;background:#FF9800;color:#fff;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:6px}
.tname{font-size:15px;font-weight:700;color:#E65100;margin-bottom:5px}
.trea{font-size:13px;color:#5D4037;line-height:1.6;margin-bottom:8px}
/* 재료 칩 */
.icatbox{margin-bottom:15px}
.icatlbl{font-size:11px;font-weight:700;color:#BDBDBD;margin-bottom:7px;letter-spacing:.4px}
.ichips{display:flex;flex-wrap:wrap;gap:6px}
.ichip{padding:6px 12px;border-radius:20px;border:1.5px solid #E8E8E0;background:#fff;font-size:12px;cursor:pointer;color:#757575;transition:all .12s;font-family:inherit;user-select:none}
.ichip.p.on{background:#FFEBEE;border-color:#EF9A9A;color:#C62828;font-weight:600}
.ichip.v.on{background:#E8F5E9;border-color:#A5D6A7;color:#2E7D32;font-weight:600}
.ichip.d.on{background:#E3F2FD;border-color:#90CAF9;color:#1565C0;font-weight:600}
.ichip.s.on{background:#F3E5F5;border-color:#CE93D8;color:#6A1B9A;font-weight:600}
.ichip.g.on{background:#FBE9E7;border-color:#FFAB91;color:#BF360C;font-weight:600}
.cinput-row{display:flex;gap:8px;margin-top:10px}
.cinput-row input{flex:1;padding:9px 13px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:13px;font-family:inherit;outline:none}
.cinput-row input:focus{border-color:#4CAF50}
.addbtn{padding:9px 13px;background:#2E7D32;color:#fff;border:none;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.selbar{display:flex;flex-wrap:wrap;gap:5px;min-height:26px;padding:3px 0}
.stag{display:flex;align-items:center;gap:3px;padding:4px 9px;background:#E8F5E9;border-radius:20px;font-size:12px;color:#2E7D32;font-weight:600}
.stag button{border:none;background:none;cursor:pointer;color:#2E7D32;font-size:13px;line-height:1;padding:0}
.noing{font-size:12px;color:#BDBDBD}
/* 상태 바 */
.sstat{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}
.sstat.ok{background:#E8F5E9;color:#2E7D32}
.sstat.ld{background:#F5F5F5;color:#757575}
.sstat.er{background:#FFEBEE;color:#C62828}
/* 상자 뽑기 */
.box-wrap{text-align:center;padding:10px 0 6px}
.box-title{font-size:13px;font-weight:700;color:#616161;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:6px}
.boxes-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.mbox{width:68px;height:68px;border-radius:14px;background:linear-gradient(145deg,#43A047,#2E7D32);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;transition:all .2s;box-shadow:0 3px 10px rgba(46,125,50,.35);font-family:inherit;color:#fff}
.mbox i{font-size:28px}
.mbox:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 6px 16px rgba(46,125,50,.45)}
.mbox:disabled{cursor:default;transform:none}
.mbox.opened{background:linear-gradient(145deg,#FFF9C4,#FFF176);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.mbox.opened i{display:none}
.mbox.opened .mname{display:block}
.mname{display:none;font-size:10px;font-weight:700;color:#E65100;word-break:keep-all;line-height:1.3;padding:3px;text-align:center}
.pick-result{min-height:50px;margin-top:4px}
.pick-name{font-size:22px;font-weight:700;color:#2E7D32;animation:popIn .3s ease}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.pick-sub{font-size:13px;color:#757575;margin-top:4px}
.pick-tip{font-size:12px;color:#546E7A;margin-top:6px;background:#E8F5E9;border-radius:8px;padding:7px 10px;display:inline-block}
.reshuf-btn{margin-top:12px;padding:9px 20px;background:#fff;border:1.5px solid #4CAF50;border-radius:20px;color:#2E7D32;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;margin-left:auto;margin-right:auto}
.reshuf-btn:hover{background:#E8F5E9}
/* 메뉴 카드 */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:2px}
.mcard{background:#fff;border:1px solid #EBEBEB;border-radius:14px;padding:13px;position:relative;overflow:hidden;transition:box-shadow .15s}
.mcard::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:#BDBDBD}
.mcard.T::before{background:#42A5F5}
.mcard.B::before{background:#EF5350}
.mcard.R::before{background:#FFB300}
.mcard.G::before{background:#FF7043}
.mcard.W::before{background:#AB47BC}
.mcard.S::before{background:#26A69A}
.mcard:hover{box-shadow:0 3px 12px rgba(0,0,0,.09)}
.mc-cat{font-size:10px;font-weight:700;color:#BDBDBD;letter-spacing:.5px;margin-bottom:4px}
.mc-name{font-size:14px;font-weight:700;color:#212121;margin-bottom:4px}
.mc-ing{font-size:11px;color:#9E9E9E;line-height:1.4;margin-bottom:3px}
.mc-memo{font-size:11px;color:#757575;line-height:1.4;font-style:italic}
.mc-meta{display:flex;gap:8px;margin-top:6px}
.mc-chip{font-size:10px;color:#BDBDBD;display:flex;align-items:center;gap:2px}
.mc-chip i{font-size:11px}
.opensheet{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;border:1.5px dashed #E0E0E0;border-radius:12px;color:#9E9E9E;font-size:13px;text-decoration:none;transition:all .15s;margin-top:12px;background:none;width:100%;font-family:inherit;cursor:pointer}
.opensheet:hover{border-color:#4CAF50;color:#2E7D32}

/* ── 가격 비교 탭 ── */
.price-section-title{font-size:13px;font-weight:700;color:#616161;margin-bottom:12px;display:flex;align-items:center;gap:6px;padding-bottom:10px;border-bottom:1px solid #F0F0F0}
.price-section-title i{font-size:16px;color:#1565C0}
/* 영수증 업로드 */
.receipt-zone{border:2px dashed #90CAF9;border-radius:14px;padding:24px;text-align:center;cursor:pointer;transition:all .2s;background:#F8FBFF;margin-bottom:14px}
.receipt-zone:hover{border-color:#1565C0;background:#E3F2FD}
.receipt-zone i{font-size:36px;color:#90CAF9;margin-bottom:8px;display:block}
.receipt-zone p{font-size:14px;color:#757575}
.receipt-zone small{font-size:12px;color:#BDBDBD;margin-top:4px;display:block}
/* 수동 입력 */
.price-form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:10px}
.price-form input,.price-form select{padding:9px 11px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:13px;font-family:inherit;outline:none;width:100%}
.price-form input:focus,.price-form select:focus{border-color:#1565C0}
.price-form label{font-size:11px;color:#9E9E9E;margin-bottom:4px;display:block}
.add-price-btn{padding:9px 14px;background:#1565C0;color:#fff;border:none;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;display:flex;align-items:center;gap:4px;height:40px}
.add-price-btn:hover{background:#0D47A1}
/* 가격 목록 */
.price-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.price-row{background:#fff;border:1px solid #EBEBEB;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;transition:box-shadow .15s}
.price-row:hover{box-shadow:0 2px 8px rgba(0,0,0,.07)}
.price-ing-name{font-size:14px;font-weight:600;color:#212121;flex:1;min-width:0}
.price-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.ptag{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500}
.ptag.coup{background:#E8F5E9;color:#2E7D32}
.ptag.mart{background:#E3F2FD;color:#1565C0}
.ptag.etc{background:#F3E5F5;color:#6A1B9A}
.price-detail{font-size:12px;color:#757575;margin-top:3px}
.price-unit{font-size:13px;font-weight:700;color:#E65100}
.price-del{border:none;background:none;cursor:pointer;color:#BDBDBD;font-size:16px;padding:2px;display:flex;align-items:center;flex-shrink:0}
.price-del:hover{color:#E53935}
/* 가격 비교 뱃지 */
.cheaper{background:#E8F5E9;color:#2E7D32;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.expensive{background:#FFEBEE;color:#C62828;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
/* AI 파싱 결과 */
.parsed-preview{background:#E8F5E9;border-radius:12px;padding:14px;margin-top:12px}
.parsed-title{font-size:12px;font-weight:700;color:#2E7D32;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.parsed-item{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #C8E6C9}
.parsed-item:last-child{border-bottom:none}
.parsed-name{font-size:13px;color:#212121;font-weight:500}
.parsed-price{font-size:13px;color:#2E7D32;font-weight:700}
.confirm-btn{width:100%;padding:12px;border-radius:10px;border:none;background:#2E7D32;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.confirm-btn:hover{background:#1B5E20}
/* 검색 */
.search-row{display:flex;gap:8px;margin-bottom:14px}
.search-row input{flex:1;padding:10px 14px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:13px;font-family:inherit;outline:none}
.search-row input:focus{border-color:#1565C0}
.filter-select{padding:10px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:13px;font-family:inherit;outline:none;color:#616161}
/* 공통 */
.ldbox{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px}
.dots{display:flex;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:#4CAF50;animation:bop .7s infinite}
.dot:nth-child(2){animation-delay:.12s}.dot:nth-child(3){animation-delay:.24s}
@keyframes bop{0%,80%,100%{transform:scale(.7);opacity:.4}40%{transform:scale(1.1);opacity:1}}
.ldtxt{font-size:13px;color:#9E9E9E}
.errbox{padding:13px;background:#FFEBEE;border-radius:10px;font-size:13px;color:#C62828;margin-top:14px;display:flex;align-items:center;gap:6px}
.empty-msg{text-align:center;padding:30px;color:#BDBDBD}
.empty-msg i{font-size:40px;display:block;margin-bottom:8px}
@media(max-width:480px){.alts{grid-template-columns:1fr}.rname{font-size:20px}.price-form{grid-template-columns:1fr 1fr}.price-form .price-add-col{grid-column:span 2}}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-in">
    <h1><i class="ti ti-tools-kitchen-2" style="font-size:20px"></i> 우리가족 오늘 메뉴 추천</h1>
    <div class="wpill" id="wp"><i class="ti ti-sun"></i><span id="wt">날씨 확인 중</span></div>
  </div>
</header>
<nav class="tabs">
  <div class="tabs-in">
    <button class="tbtn on" onclick="go('rec',this)"><i class="ti ti-wand"></i>메뉴 추천</button>
    <button class="tbtn" onclick="go('fridge',this)"><i class="ti ti-fridge"></i>냉장고 추천</button>
    <button class="tbtn" onclick="go('mymenus',this)"><i class="ti ti-list"></i>내 메뉴 목록</button>
    <button class="tbtn" onclick="go('price',this)"><i class="ti ti-tag"></i>가격 비교</button>
  </div>
</nav>
<main class="wrap">

<!-- 탭1: 메뉴 추천 -->
<div id="pane-rec" class="pane on">
  <div class="card">
    <div class="clabel"><i class="ti ti-mood-smile"></i>오늘 기분은?</div>
    <div class="moods" id="moodGrid">
      <button class="mbtn on" data-m="뭐든 좋아">뭐든 좋아</button>
      <button class="mbtn" data-m="든든하게">든든하게</button>
      <button class="mbtn" data-m="가볍게">가볍게</button>
      <button class="mbtn" data-m="매운게 땡겨">매운 게 땡겨</button>
      <button class="mbtn" data-m="따뜻한 국물">따뜻한 국물</button>
      <button class="mbtn" data-m="간단하게">간단하게</button>
      <button class="mbtn" data-m="색다른거">색다른 거</button>
      <button class="mbtn" data-m="아이들이 좋아하는">아이들 최애</button>
    </div>
  </div>
  <button class="gbtn gr" id="rb1" onclick="getAI('mood')"><i class="ti ti-sparkles"></i> 오늘 메뉴 추천받기</button>
  <div id="res1"></div>
</div>

<!-- 탭2: 냉장고 추천 -->
<div id="pane-fridge" class="pane">
  <div class="card">
    <div class="clabel"><i class="ti ti-fridge"></i>집에 있는 재료를 골라주세요</div>
    <div class="icatbox">
      <div class="icatlbl">단백질</div>
      <div class="ichips">
        <button class="ichip p" data-i="돼지고기 앞다리살">앞다리살</button>
        <button class="ichip p" data-i="삼겹살">삼겹살</button>
        <button class="ichip p" data-i="돼지고기 목살">목살</button>
        <button class="ichip p" data-i="돼지 국거리">돼지 국거리</button>
        <button class="ichip p" data-i="소고기 국거리">소 국거리</button>
        <button class="ichip p" data-i="소고기 불고기용">소 불고기용</button>
        <button class="ichip p" data-i="닭 볶음탕용">닭 볶음탕용</button>
        <button class="ichip p" data-i="닭가슴살">닭가슴살</button>
        <button class="ichip p" data-i="닭다리">닭다리</button>
        <button class="ichip p df" data-i="계란">계란</button>
        <button class="ichip p df" data-i="두부">두부</button>
        <button class="ichip p" data-i="참치캔">참치캔</button>
        <button class="ichip p" data-i="햄(스팸)">햄(스팸)</button>
        <button class="ichip p" data-i="소시지">소시지</button>
        <button class="ichip p" data-i="새우">새우</button>
        <button class="ichip p" data-i="오징어">오징어</button>
        <button class="ichip p" data-i="베이컨">베이컨</button>
        <button class="ichip p" data-i="멸치">멸치</button>
      </div>
    </div>
    <div class="icatbox">
      <div class="icatlbl">채소</div>
      <div class="ichips">
        <button class="ichip v df" data-i="대파">대파</button>

      weather = (m>=6&&m<=8)?'더운 여름':(m>=12||m<=2)?'추운 겨울':'선선한 날씨';
      document.getElementById('wt').textContent = weather;
    });

// CSV
function parseCSV(text) {
  var lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  var headers = lines[0].split(',').map(function(h){ return h.trim().replace(/^"|"$/g,''); });
  return lines.slice(1).map(function(line) {
    var vals=[], cur='', inQ=false;
    for (var i=0; i<line.length; i++) {
      if (line[i]==='"') { inQ=!inQ; }
      else if (line[i]===','&&!inQ) { vals.push(cur.trim()); cur=''; }
      else { cur+=line[i]; }
    }
    vals.push(cur.trim());
    var obj={};
    headers.forEach(function(h,i){ obj[h]=(vals[i]||'').replace(/^"|"$/g,''); });
    return obj;
  }).filter(function(r){ return r[headers[0]]&&r[headers[0]].trim(); });
}
function loadSheet() {
  var st=document.getElementById('sstat');
  st.className='sstat ld'; st.innerHTML='<i class="ti ti-loader-2"></i> 구글 시트에서 불러오는 중...';
  fetch(CSV_URL+'&t='+Date.now())
    .then(function(r){ if(!r.ok) throw new Error('fail'); return r.text(); })
    .then(function(text) {
      menuData=parseCSV(text);
      st.className='sstat ok'; st.innerHTML='<i class="ti ti-circle-check"></i> '+menuData.length+'개 메뉴 불러옴';
      renderGrid();
      if (menuData.length>0) { document.getElementById('boxCard').style.display='block'; renderBoxes(); }
    }).catch(function(){
      st.className='sstat er'; st.innerHTML='<i class="ti ti-alert-circle"></i> 시트를 불러올 수 없어요. 공유 설정을 확인해주세요.';
    });
}
function catKey(cat) {
  if (!cat) return '';
  if (cat.indexOf('찌개')>=0||cat.indexOf('국')>=0) return 'T';
  if (cat.indexOf('볶음밥')>=0) return 'R';
  if (cat.indexOf('볶음')>=0) return 'B';
  if (cat.indexOf('구이')>=0) return 'G';
  if (cat.indexOf('양식')>=0) return 'W';
  if (cat.indexOf('분식')>=0) return 'S';
  return '';
}

// 상자 뽑기 (아이콘만 사용)
var BOX_ICONS = ['ti-package','ti-gift','ti-star-filled','ti-heart-filled','ti-diamond','ti-crown','ti-trophy','ti-rocket','ti-flame','ti-bolt'];

function shuffleArr(arr) {
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function renderBoxes() {
  var row=document.getElementById('boxesRow');

  boxMenus=shuffleArr(menuData).slice(0,count);
  row.innerHTML=boxMenus.map(function(m,idx){
    var icon=BOX_ICONS[idx%BOX_ICONS.length];
    var color=BOX_COLORS[idx%BOX_COLORS.length];
    var name=m['메뉴명']||m[Object.keys(m)[0]]||'';
    return '<button class="mbox" id="box-'+idx+'" onclick="openBox('+idx+')" style="background:linear-gradient(145deg,'+color+'cc,'+color+')">'

function parseAmount(amtStr) {
  // "500g" -> {val:500, unit:"g"} / "1kg" -> {val:1000, unit:"g"} / "10개" -> {val:10, unit:"개"}
  if (!amtStr) return { val: 1, unit: '개' };
  var s = amtStr.trim();
  var m = s.match(/^([\d.]+)\s*(kg|g|ml|l|L|개|팩|봉|묶음)?/i);
  if (!m) return { val: 1, unit: s };
  var val = parseFloat(m[1]);
  var unit = (m[2]||'개').toLowerCase();
  if (unit==='kg') { val=val*1000; unit='g'; }
  if (unit==='l') { val=val*1000; unit='ml'; }
  return { val: val, unit: unit };
}
function calcUnitPrice(price, amtStr) {
  var a = parseAmount(amtStr);
  if (!a.val) return '';
  var per = Math.round(price / a.val);
  return per.toLocaleString() + '원/' + a.unit;
}
function addPriceItem(name, price, amount, store) {
  var n = name || document.getElementById('pi-name').value.trim();
  var p = price || parseInt(document.getElementById('pi-price').value);
  var a = amount || document.getElementById('pi-amount').value.trim();
  var s = store || document.getElementById('pi-store').value;
  if (!n || !p || isNaN(p)) {
    document.getElementById('addMsg').innerHTML='<span style="color:#C62828">품목명과 가격을 입력해주세요</span>'; return;
  }
  var item = {
    id: Date.now()+'_'+Math.random().toString(36).slice(2,6),
    name: n, price: p, amount: a, store: s,
    unitPrice: calcUnitPrice(p, a),
    date: new Date().toLocaleDateString('ko-KR')
  };
  priceDB.unshift(item);
  savePriceDB();
  if (!name) {
    document.getElementById('pi-name').value='';
    document.getElementById('pi-price').value='';
    document.getElementById('pi-amount').value='';
    var msg=document.getElementById('addMsg');
    msg.innerHTML='<i class="ti ti-circle-check" style="color:#2E7D32;font-size:12px;vertical-align:-1px"></i> '+n+' 추가됨!';
    setTimeout(function(){ msg.innerHTML=''; },2000);
  }
  renderPriceList();
}
function deletePriceItem(id) {
  priceDB = priceDB.filter(function(item){ return item.id!==id; });
  savePriceDB(); renderPriceList();
}

// 같은 품목의 다른 구매처 가격과 비교
function compareTag(item) {
  var same = priceDB.filter(function(x){ return x.name===item.name && x.id!==item.id && x.amount===item.amount; });
  if (!same.length) return '';
  var cheapest = same.reduce(function(a,b){ return a.price<b.price?a:b; });
  if (item.price < cheapest.price) return '<span class="cheaper"><i class="ti ti-trending-down" style="font-size:10px"></i> 최저가</span>';
  if (item.price > cheapest.price) return '<span class="expensive"><i class="ti ti-trending-up" style="font-size:10px"></i> +'+(item.price-cheapest.price).toLocaleString()+'원</span>';
  return '';
}
function storeTagClass(store) {
  if (store==='쿠팡') return 'coup';
  if (store==='마트') return 'mart';
  return 'etc';
}
function renderPriceList() {
  var el=document.getElementById('priceList');
  var query=(document.getElementById('priceSearch')||{}).value||'';
  var storeF=(document.getElementById('storeFilter')||{}).value||'';
  var list=priceDB.filter(function(item){
    var nameOk = !query || item.name.indexOf(query)>=0;
    var storeOk = !storeF || item.store===storeF;
    return nameOk&&storeOk;
  });
  if (!list.length) {
    el.innerHTML='<div class="empty-msg"><i class="ti ti-tag"></i>아직 기록된 가격이 없어요.<br>영수증을 업로드하거나 직접 입력해주세요!</div>';
    return;
  }
  el.innerHTML='<div class="price-list">'+list.map(function(item){
    return '<div class="price-row">'
      +'<div style="flex:1;min-width:0">'
      +'<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">'
      +'<span class="price-ing-name">'+item.name+'</span>'
      +compareTag(item)
      +'</div>'
      +'<div style="display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap">'
      +'<span class="ptag '+storeTagClass(item.store)+'"><i class="ti ti-building-store" style="font-size:10px;vertical-align:-1px"></i> '+item.store+'</span>'
      +(item.amount?'<span style="font-size:12px;color:#9E9E9E">'+item.amount+'</span>':'')
      +'<span style="font-size:13px;font-weight:700;color:#212121">'+item.price.toLocaleString()+'원</span>'
      +(item.unitPrice?'<span style="font-size:11px;color:#E65100">('+item.unitPrice+')</span>':'')
      +'</div>'
      +'<div style="font-size:11px;color:#BDBDBD;margin-top:3px">'+item.date+'</div>'
      +'</div>'
      +'<button class="price-del" onclick="deletePriceItem(\''+item.id+'\')"><i class="ti ti-trash" style="font-size:15px"></i></button>'
      +'</div>';
  }).join('')+'</div>';
}

// 영수증 AI 파싱
function parseReceipt(input) {
  var file = input.files[0];
  if (!file) return;
  var resDiv = document.getElementById('receiptResult');
  resDiv.innerHTML='<div class="ldbox"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><p class="ldtxt">AI가 영수증을 읽는 중...</p></div>';
  var reader = new FileReader();
  reader.onload = function(e) {
    var b64 = e.target.result.split(',')[1];
    var mediaType = file.type || 'image/jpeg';
    fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        messages:[{
          role:'user',
          content:[
            {type:'image',source:{type:'base64',media_type:mediaType,data:b64}},
            {type:'text',text:'이 영수증 이미지에서 식재료/식품 품목과 가격을 추출해주세요. 식품이 아닌 항목(생활용품, 음료 등)은 제외해도 됩니다.\n반드시 JSON만 출력하세요 (다른 텍스트 없이):\n{"items":[{"name":"품목명","price":숫자,"amount":"용량 또는 수량 (있으면)"}]}'}
          ]
        }]
      })
    })
    .then(function(r){ if(!r.ok) throw new Error('API '+r.status); return r.json(); })
    .then(function(data){
      var raw=data.content.map(function(c){ return c.text||''; }).join('');
      var cleaned=raw.replace(/```json|```/g,'').trim();
      var match=cleaned.match(/\{[\s\S]*\}/);
      if (!match) throw new Error('파싱 실패');
      var parsed=JSON.parse(match[0]);
      var items=parsed.items||[];
      if (!items.length) throw new Error('품목 없음');
      resDiv.innerHTML='<div class="parsed-preview">'
        +'<div class="parsed-title"><i class="ti ti-circle-check" style="font-size:14px"></i> '+items.length+'개 품목을 읽었어요</div>'
        +items.map(function(it,idx){
          return '<div class="parsed-item">'
            +'<span class="parsed-name">'+it.name+(it.amount?' ('+it.amount+')':'')+'</span>'
            +'<span class="parsed-price">'+it.price.toLocaleString()+'원</span>'
            +'</div>';
        }).join('')
        +'<button class="confirm-btn" onclick="confirmReceiptItems()"><i class="ti ti-check"></i> 모두 가격 기록에 추가</button>'
        +'</div>';
      resDiv._parsedItems = items;
    })
    .catch(function(e){
      resDiv.innerHTML='<div class="errbox"><i class="ti ti-alert-circle"></i> 영수증을 읽지 못했어요 ('+e.message+'). 선명한 사진으로 다시 시도해주세요.</div>';
    });
    input.value='';
  };
  reader.readAsDataURL(file);
}
function confirmReceiptItems() {
  var resDiv=document.getElementById('receiptResult');
  var items=resDiv._parsedItems||[];
  var store='마트'; // 영수증은 기본 마트
  items.forEach(function(it){
    addPriceItem(it.name, it.price, it.amount||'', store);
  });
  resDiv.innerHTML='<div style="padding:12px;background:#E8F5E9;border-radius:10px;font-size:13px;color:#2E7D32;display:flex;align-items:center;gap:6px"><i class="ti ti-circle-check"></i> '+items.length+'개 품목이 가격 기록에 추가됐어요!</div>';
}

// AI 추천
function getAI(mode) {
  var btnId=mode==='mood'?'rb1':'rb2';
  var resId=mode==='mood'?'res1':'res2';
  var btn=document.getElementById(btnId);
  var resDiv=document.getElementById(resId);
  var ings=getSelected();
  if (mode==='fridge'&&!ings.length) {
    resDiv.innerHTML='<div class="errbox"><i class="ti ti-alert-circle"></i> 재료를 먼저 선택해주세요!</div>'; return;
  }
  btn.disabled=true;
  resDiv.innerHTML='<div class="ldbox"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><p class="ldtxt">맞춤 메뉴 고르는 중...</p></div>';
  var menuText='';
  if (menuData.length) {
    menuText=menuData.map(function(r,i){
      var k=Object.keys(r);
      return (i+1)+'. '+(r['메뉴명']||r[k[0]])+' | 재료: '+(r['주재료']||r[k[1]]||'')+' | 레시피: '+(r['레시피 메모']||r['레시피메모']||r[k[2]]||'')+' | 카테고리: '+(r['카테고리']||'')+' | 시간: '+(r['조리시간(분)']||r['조리시간']||'')+'분 | 난이도: '+(r['난이도']||'');
    }).join('\n');
  } else {
    menuText='[샘플]\n1. 김치찌개|찌개\n2. 된장찌개|찌개\n3. 제육볶음|볶음\n4. 계란볶음밥|볶음밥\n5. 파스타|양식\n6. 떡볶이|분식';
  }
  var day=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][new Date().getDay()];
  var kidNote='이 가족은 어린이가 있고 편식이 심합니다. 맵거나 쓰거나 자극적인 향신료는 피하고, 아이들이 좋아하는 고소하고 달콤하고 바삭한 스타일 위주로 추천해주세요.';
  var jsonSpec='{"main":{"name":"메뉴명","reason":"추천이유 2~3문장","recipe_tip":"레시피팁 또는 빈문자열","youtube_queries":["검색어1","검색어2"]},"alternatives":[{"name":"대안1","reason":"이유"},{"name":"대안2","reason":"이유"}],"trending_bonus":{"name":"트렌드 메뉴","reason":"이유와 조리법","youtube_query":"검색어"}}';
  var fridgeSpec='{"main":{"name":"메뉴명","reason":"이유 2~3문장","recipe_tip":"재료 활용 팁","youtube_queries":["검색어1","검색어2"],"missing_ingredients":["추가하면 좋은 재료"]},"alternatives":[{"name":"대안1","reason":"이유"},{"name":"대안2","reason":"이유"}],"trending_bonus":{"name":"의외 메뉴","reason":"이유","youtube_query":"검색어"}}';
  var prompt = mode==='mood'
    ? '한국 가정요리 추천 AI입니다. '+kidNote+'\n[날씨] '+weather+' (양주시 옥정동) [요일] '+day+' [기분] '+mood+'\n[메뉴 목록]\n'+menuText+'\nJSON만 출력:\n'+jsonSpec
    : '냉장고 파먹기 요리 추천 AI입니다. '+kidNote+'\n[재료] '+ings.join(', ')+'\n[날씨] '+weather+' [요일] '+day+'\n[메뉴 목록]\n'+menuText+'\nJSON만 출력:\n'+fridgeSpec;
  fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
  })
  .then(function(r){ if(!r.ok) throw new Error('API '+r.status); return r.json(); })
  .then(function(data){
    var raw=data.content.map(function(c){ return c.text||''; }).join('');
    var m=raw.replace(/```json|```/g,'').trim().match(/\{[\s\S]*\}/);
    if (!m) throw new Error('JSON 없음');
    renderResult(resId,JSON.parse(m[0]),mode);
  })
  .catch(function(e){
    resDiv.innerHTML='<div class="errbox"><i class="ti ti-alert-circle"></i> 추천 실패 ('+e.message+'). 잠시 후 다시 시도해주세요.</div>';
  })
  .finally(function(){ btn.disabled=false; });
}

function ytUrl(q){ return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q+' 레시피 쇼츠'); }

function renderResult(id, rec, mode) {
  var m=rec.main||{}, alts=rec.alternatives||[], trend=rec.trending_bonus;
  var missing=(mode==='fridge'&&m.missing_ingredients&&m.missing_ingredients.length)
    ?'<div class="rmiss"><i class="ti ti-shopping-cart" style="font-size:12px"></i> 있으면 더 좋은 재료: '+m.missing_ingredients.join(', ')+'</div>':'';
  var ytHtml=(m.youtube_queries||[]).map(function(q){
    return '<a class="ytrow" href="'+ytUrl(q)+'" target="_blank">'
      +'<div class="yticon"><i class="ti ti-brand-youtube"></i></div>'
      +'<div class="ytt"><div class="ytt-t">'+q+' 레시피</div><div class="ytt-s">유튜브 쇼츠 검색</div></div>'
      +'<i class="ti ti-external-link" style="color:#BDBDBD;font-size:13px"></i></a>';
  }).join('');
  var altHtml=alts.map(function(a){
    return '<div class="altcard"><div class="altname">'+a.name+'</div><div class="altrea">'+a.reason+'</div></div>';
  }).join('');
  var trendHtml=trend
    ?'<p style="font-size:12px;color:#BDBDBD;margin:14px 0 8px;padding-left:4px">의외의 추천</p>'
      +'<div class="tcard"><div class="tbadge2"><i class="ti ti-trending-up"></i> 보너스</div>'
      +'<div class="tname">'+trend.name+'</div><div class="trea">'+trend.reason+'</div>'
      +'<a class="ytrow" href="'+ytUrl(trend.youtube_query)+'" target="_blank" style="background:#fff">'
      +'<div class="yticon"><i class="ti ti-brand-youtube"></i></div>'
      +'<div class="ytt"><div class="ytt-t">'+trend.youtube_query+' 레시피</div><div class="ytt-s">유튜브 쇼츠 검색</div></div>'
      +'<i class="ti ti-external-link" style="color:#BDBDBD;font-size:13px"></i></a></div>':'';
  document.getElementById(id).innerHTML='<div class="res-wrap">'
    +'<div class="main-res">'
    +'<div class="rbadge"><i class="ti ti-sparkles"></i> 오늘의 추천</div>'
    +'<div class="rname">'+(m.name||'')+'</div>'
    +'<div class="rreason">'+(m.reason||'')+'</div>'
    +(m.recipe_tip?'<div class="rtip"><b>레시피 팁</b>'+m.recipe_tip+'</div>':'')
    +missing
    +(ytHtml?'<div class="ytsec"><div class="ytlbl"><i class="ti ti-brand-youtube"></i> 레시피 영상</div>'+ytHtml+'</div>':'')
    +'</div>'
    +(alts.length?'<p style="font-size:12px;color:#BDBDBD;margin-bottom:8px;padding-left:4px">다른 선택지</p><div class="alts">'+altHtml+'</div>':'')
    +trendHtml+'</div>';
}
